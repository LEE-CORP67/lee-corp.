<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    text-align: center;
    padding: 40px;
  }
  h1 {
    color: #333;
  }
  .gallery {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin-top: 30px;
  }
  .gallery img {
    border: 3px solid #ccc;
    border-radius: 8px;
    transition: transform 0.2s;
  }
  .gallery img:hover {
    transform: scale(1.03);
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>


<div class="gallery">

  <!-- France -->
  <img src="https://flagcdn.com/w320/fr.png" usemap="#mapFrance" alt="Flag of France" width="300" height="200">
  <map name="mapFrance">
    <area shape="rect" coords="0,0,300,200" href="https://en.wikipedia.org/wiki/France" target="_blank" alt="France">
  </map>

  <!-- Japan -->
  <img src="https://flagcdn.com/w320/jp.png" usemap="#mapJapan" alt="Flag of Japan" width="300" height="200">
  <map name="mapJapan">
    <area shape="rect" coords="0,0,300,200" href="https://en.wikipedia.org/wiki/Japan" target="_blank" alt="Japan">
  </map>

  <!-- Brazil -->
  <img src="https://flagcdn.com/w320/br.png" usemap="#mapBrazil" alt="Flag of Brazil" width="300" height="200">
  <map name="mapBrazil">
    <area shape="rect" coords="0,0,300,200" href="https://en.wikipedia.org/wiki/Brazil" target="_blank" alt="Brazil">
  </map>

</div>

</body>
</html>
